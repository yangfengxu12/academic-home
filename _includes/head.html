{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';

  // Follow each visitor's browser preference, falling back to light mode.
  (function () {
    var browserTheme = typeof window.matchMedia === "function"
      ? window.matchMedia("(prefers-color-scheme: dark)")
      : null;

    function applyTheme() {
      var theme = browserTheme && browserTheme.matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    }

    applyTheme();

    if (browserTheme) {
      if (typeof browserTheme.addEventListener === "function") {
        browserTheme.addEventListener("change", applyTheme);
      } else if (typeof browserTheme.addListener === "function") {
        browserTheme.addListener(applyTheme);
      }
    }
  }());
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
